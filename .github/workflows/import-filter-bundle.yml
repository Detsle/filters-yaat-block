name: Import filter database bundle

on:
  push:
    branches:
      - main
    paths:
      - repository-bundle/parts/part-11.b64

permissions:
  contents: write

jobs:
  import-filter-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and extract filter database
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import shutil
          import tarfile
          import tempfile
          from pathlib import Path, PurePosixPath

          parts_dir = Path("repository-bundle/parts")
          parts = sorted(parts_dir.glob("part-*.b64"))
          expected_names = [f"part-{i:02d}.b64" for i in range(1, 12)]
          if [p.name for p in parts] != expected_names:
              raise SystemExit("Filter bundle parts are incomplete or out of order")
          raw = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive_bytes = base64.b64decode(raw, validate=True)

          with tempfile.TemporaryDirectory() as temp_dir:
              archive_path = Path(temp_dir) / "filters.tar.gz"
              extract_root = Path(temp_dir) / "extract"
              archive_path.write_bytes(archive_bytes)
              extract_root.mkdir()

              with tarfile.open(archive_path, "r:gz") as archive:
                  members = archive.getmembers()
                  for member in members:
                      item = PurePosixPath(member.name)
                      if item.is_absolute() or ".." in item.parts:
                          raise SystemExit(f"Unsafe path in bundle: {member.name}")
                      if not item.parts or item.parts[0] != "filters-yaat-block":
                          raise SystemExit(f"Unexpected bundle root: {member.name}")
                      if member.issym() or member.islnk() or member.isdev():
                          raise SystemExit(f"Unsupported archive member: {member.name}")
                  archive.extractall(extract_root, filter="data")

              source_root = extract_root / "filters-yaat-block"
              manifest_path = source_root / "filters-manifest.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("schemaVersion") != 1:
                  raise SystemExit("Unsupported filters manifest schema")
              if manifest.get("filterVersion") != "1.0.0":
                  raise SystemExit("Unexpected initial filter database version")
              categories = manifest.get("categories")
              if not isinstance(categories, dict) or len(categories) != 14:
                  raise SystemExit("Expected all 14 filter categories")

              for category, meta in categories.items():
                  relative = PurePosixPath(meta["path"])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe manifest path: {meta['path']}")
                  data = source_root.joinpath(*relative.parts).read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != meta["sha256"] or len(data) != meta["bytes"]:
                      raise SystemExit(f"Integrity check failed: {category}")
                  text = data.decode("utf-8")
                  if "@import" in text.lower() or "javascript:" in text.lower() or "expression(" in text.lower() or "url(" in text.lower():
                      raise SystemExit(f"External or executable CSS construct found: {category}")

              # Replace the incomplete hand-created draft tree with the exact
              # validated package. Preserve only .git and this import workflow.
              repo_root = Path.cwd()
              for child in list(repo_root.iterdir()):
                  if child.name in {".git", ".github"}:
                      continue
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
              for source in source_root.iterdir():
                  destination = repo_root / source.name
                  if source.is_dir():
                      shutil.copytree(source, destination)
                  else:
                      shutil.copy2(source, destination)

          shutil.rmtree(parts_dir.parent)
          print(f"Imported {len(categories)} verified filter categories, version {manifest['filterVersion']}")

      - name: Commit imported filter files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No filter changes to commit"
          else
            git commit -m "Publish filters database 1.0.0"
            git push origin HEAD:main
          fi
